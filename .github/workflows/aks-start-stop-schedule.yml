name: AKS Start/Stop Schedule

on:
  schedule:
    # 08:00 BRT (11:00 UTC) on weekdays - start the cluster
    - cron: "0 11 * * 1-5"
    # 20:00 BRT (23:00 UTC) on weekdays - stop the cluster
    - cron: "0 23 * * 1-5"
  workflow_dispatch:
    inputs:
      action:
        description: "Manual action to run"
        required: true
        type: choice
        options:
          - start
          - stop

permissions:
  id-token: write
  contents: read

jobs:
  start-or-stop:
    runs-on: ubuntu-latest
    steps:
      - name: Determine action
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "action=${{ inputs.action }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 11 * * 1-5" ]; then
            echo "action=start" >> "$GITHUB_OUTPUT"
          else
            echo "action=stop" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login (OIDC, no secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Start or stop AKS cluster
        run: |
          az aks ${{ steps.decide.outputs.action }} \
            --name aks-identity-journeys \
            --resource-group rg-identity-journeys-bra
